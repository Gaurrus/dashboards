[platformio]
default_envs = wokwi

[common]
build_flags =
  -DUSER_SETUP_LOADED=1
  -DILI9341_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=19
  -DTFT_MOSI=23
  -DTFT_SCLK=18
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=4
  -DTFT_BL=32
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DSPI_FREQUENCY=40000000
lib_deps =
  bodmer/TFT_eSPI@^2.5.43

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}

[env:wokwi]
build_flags = ${common.build_flags} -DSIMULATION=1
build_src_filter = +<*> -<hal/hal_real.cpp> -<ui/lvgl/>

[env:hardware]
build_flags = ${common.build_flags}
build_src_filter = +<*> -<hal/hal_sim.cpp> -<ui/lvgl/>
lib_deps =
  ${common.lib_deps}
  adafruit/Adafruit ADS1X15@^2.4.0
  mikalhart/TinyGPSPlus@^1.0.3
